<div class="cart-container">
  <h2>Carrito de Compras</h2>
  <div *ngIf="cartItems.length === 0" class="empty-cart">
    <p>El carrito está vacío.</p>
  </div>
  <div *ngIf="cartItems.length > 0">
    <table>
      <thead>
        <tr>
          <th>Producto</th>
          <th>Cantidad</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of cartItems">
          <td>{{ item.nombre }}</td>
          <td>{{ item.cantidadSolicitada }}</td>
          <td>
            <button (click)="removeFromCart(item.id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="cart-summary">
      <h3>Total de Productos: {{ totalItems }}</h3>
      <button (click)="clearCart()">Vaciar Carrito</button>
      <button (click)="openWhatsAppModal()" class="whatsapp-button">Enviar por WhatsApp</button>
    </div>
  </div>
</div>

<div *ngIf="showWhatsAppModal" class="modal-overlay">
  <div class="modal-content">
    <h3>Enviar Cotización por WhatsApp</h3>
    <form (ngSubmit)="submitWhatsAppForm()">
      <div class="form-group">
        <label for="customerName">Nombre:</label>
        <input type="text" id="customerName" [(ngModel)]="customerName" name="customerName" required>
      </div>
      <div class="form-group">
        <label for="customerPhone">Teléfono:</label>
        <div class="phone-input">
          <select [(ngModel)]="selectedCountryCode" name="countryCode">
            <option *ngFor="let country of countryCodes" [ngValue]="country">{{ country.name }} ({{ country.dial_code }})</option>
          </select>
          <input type="text" id="customerPhone" [(ngModel)]="customerPhone" name="customerPhone" required>
        </div>
      </div>
      <div class="form-group">
        <label for="whatsappMessage">Mensaje:</label>
        <textarea id="whatsappMessage" [(ngModel)]="whatsappMessage" name="whatsappMessage" rows="6"></textarea>
      </div>
      <div class="modal-actions">
        <button type="submit" class="whatsapp-button">Enviar</button>
        <button type="button" (click)="closeWhatsAppModal()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
